name: Workflow specification and local runtime checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate specification files
        run: python scripts/validate_repo.py
      - name: Install the pinned pytest verification-protocol test dependency
        run: python -m pip install pytest==9.0.2
      - name: Test policy, local controller, adapters and evidence rejection
        run: python -m unittest discover -s tests -v
      - name: Test native L1 plugin, setup UI transport and Python pipe
        run: node --test harness/tests/*.test.js
  embedded-c-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install isolated contract-check dependencies
        run: python -m pip install -r standards/embedded-c/v1.3/machine/tools/requirements-validation.txt
      - name: Check schemas and synthetic structural fixtures
        run: python standards/embedded-c/v1.3/machine/tests/test_contract_schemas.py
      - name: Check read-only contract validator
        run: python standards/embedded-c/v1.3/machine/tests/test_contract_validator.py
      - name: Check readability contract compatibility
        run: python standards/embedded-c/v1.3/machine/tests/test_readability_contracts.py
  doxygen-examples:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download the pinned official Doxygen and verify its digest
        shell: pwsh
        run: |
          $archivePath = Join-Path $env:RUNNER_TEMP 'doxygen-1.18.0.zip'
          Invoke-WebRequest -Uri 'https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.windows.x64.bin.zip' -OutFile $archivePath
          $actualHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne 'e84f54cfd49ef06b0b16536056dbec0c496323de28abcce53a4269463de35eaf') { throw 'Doxygen archive digest mismatch' }
          Expand-Archive -LiteralPath $archivePath -DestinationPath (Join-Path $env:RUNNER_TEMP 'doxygen-tool')
      - name: Run actual documentation generation and rejection cases
        shell: pwsh
        run: python scripts/verify_doxygen_examples.py --doxygen "$env:RUNNER_TEMP/doxygen-tool/doxygen.exe" --expected-version 1.18.0
  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [static-checks, embedded-c-contracts, doxygen-examples]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify release tag and build reviewed assets
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          test -f "docs/releases/$(cat VERSION).md"
          python scripts/package_release.py --output-dir "$RUNNER_TEMP/reqpilot-release"
      - name: Publish stable install package and runtime update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest --title "ReqPilot $(cat VERSION)" --notes-file "docs/releases/$(cat VERSION).md" "$RUNNER_TEMP/reqpilot-release/reqpilot-$(cat VERSION).tgz" "$RUNNER_TEMP/reqpilot-release/reqpilot-runtime.json.gz" "$RUNNER_TEMP/reqpilot-release/reqpilot-update.json"
