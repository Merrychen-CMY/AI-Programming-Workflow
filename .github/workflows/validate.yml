name: Workflow specification checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate specification files
        run: python scripts/validate_repo.py
      - name: Test the static validator
        run: python -m unittest discover -s tests -v
  embedded-c-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install isolated contract-check dependencies
        run: python -m pip install -r standards/embedded-c/v1.2/machine/tools/requirements-validation.txt
      - name: Check schemas and synthetic structural fixtures
        run: python standards/embedded-c/v1.2/machine/tests/test_contract_schemas.py
      - name: Check read-only contract validator
        run: python standards/embedded-c/v1.2/machine/tests/test_contract_validator.py
      - name: Check readability contract compatibility
        run: python standards/embedded-c/v1.2/machine/tests/test_readability_contracts.py
